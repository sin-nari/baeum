<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1부 · 부천 배움 100이음 고등학교 STORY 퀴즈</title>
<meta name="theme-color" content="#1d3a40">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--deep:#1d3a40;--deep2:#24494d;--yellow:#ffe28a;--orange:#c2571f;--teal:#5fa3a0;--cream:#fbf8f0;--ink:#1d2b2f;--line:#e3dccb;
  --serif:"Gowun Batang",serif;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--deep);color:#fff;font-family:var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:#cfe0dc}
.top b{color:var(--yellow)}
.pill{background:var(--deep2);border-radius:999px;padding:4px 12px;font-weight:700}
h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.25;margin:24px 0 8px}
h1 em{font-style:normal;color:var(--yellow)}
.lead{color:#cfe0dc;font-size:16px;line-height:1.6;margin:0 0 20px}
.card{background:#fff;color:var(--ink);border-radius:24px;padding:22px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--cream)}
input:focus{outline:none;border-color:var(--teal)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800;background:var(--orange);color:#fff;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.big{font-family:var(--serif);font-size:64px;color:var(--yellow);line-height:1}
.muted{color:#9fb8b4;font-size:15px;line-height:1.6}
.cup{font-size:64px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.qn{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-weight:800;color:var(--yellow)}
.qt{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.35;margin:8px 0 18px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .25s linear}
.bar.low i{background:var(--orange)}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:700;color:#fff;background:var(--deep2);border:2px solid rgba(255,255,255,.12);transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:var(--deep)}
.o0 .l{background:#ffe28a}.o1 .l{background:#9fd6d2}.o2 .l{background:#ffc3a3}.o3 .l{background:#cbbcf0}
.opt.pick{border-color:var(--yellow);background:#2f5a5f}
.opt.right{border-color:#8fe0a8;background:#245a3e}.opt.wrong{border-color:#ff9f7a;background:#5a2f24}
.opt.dim{opacity:.45}
.fb{margin-top:18px;text-align:center;font-size:19px;font-weight:800}
.fb small{display:block;font-weight:500;color:#cfe0dc;font-size:14px;margin-top:6px;line-height:1.5}
.burst{font-size:48px;display:block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rank{display:inline-block;background:var(--yellow);color:var(--deep);border-radius:14px;padding:8px 16px;font-weight:900;font-size:18px;margin-top:10px}
.net{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#5a2f24;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;display:none}
.net.on{display:block}

/* 진행자 */
body.host .app{max-width:none;padding:26px 44px}
.hgrid{display:grid;grid-template-columns:1fr 300px;gap:30px;margin-top:16px;align-items:start}
body.host .qt{font-size:44px;margin:4px 0 18px}
body.host .opts{grid-template-columns:1fr 1fr;gap:16px}
body.host .opt{font-size:30px;padding:20px 24px;cursor:default}
body.host .opt .l{width:54px;height:54px;font-size:26px}
.side{background:var(--deep2);border-radius:24px;padding:20px;text-align:center}
.qr{background:#fff;border-radius:16px;padding:10px}.qr img{width:100%}
.side p{margin:10px 0 0;color:#cfe0dc;font-size:16px;line-height:1.5}
.side b{color:var(--yellow)}
.count{font-family:var(--serif);font-size:60px;color:var(--yellow);line-height:1;margin-top:8px}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:12}
.ring .fg{fill:none;stroke:var(--yellow);stroke-width:12;stroke-linecap:round;stroke-dasharray:408;transition:stroke-dashoffset .25s linear}
.ring.low .fg{stroke:var(--orange)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:54px}
.note{margin-top:20px;background:rgba(255,226,138,.12);border-left:6px solid var(--yellow);border-radius:12px;padding:16px 20px;font-size:22px;line-height:1.6}
.ctl{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.ctl button{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;background:var(--deep2);color:#fff}
.ctl button.main{background:var(--yellow);color:var(--deep)}
.ctl button.or{background:var(--orange)}
.ctl button.sm{font-size:13px;padding:8px 14px;opacity:.7}
.dist{display:grid;gap:8px;margin-top:4px}
.dist div{display:grid;grid-template-columns:40px 1fr 56px;gap:10px;align-items:center;font-size:20px}
.dist i{display:block;height:24px;border-radius:6px;background:rgba(255,255,255,.25);transition:width .6s}
.dist .ok i{background:#8fe0a8}
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--deep2);border-radius:12px;padding:8px 14px;font-size:19px}
.board li b{color:var(--yellow);font-family:var(--serif)}
.board li span:last-child{color:#cfe0dc;font-size:16px}
.title-h{font-family:var(--serif);font-size:58px;line-height:1.2;margin:30px 0 6px}
.title-h em{font-style:normal;color:var(--yellow)}
.bubbles{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;max-height:300px;overflow:hidden}
.bubbles span{background:var(--deep2);border-radius:999px;padding:6px 14px;font-size:18px;animation:pop .4s ease}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end;margin-top:20px;max-width:760px}
.podium div{text-align:center}
.podium .blk{border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:var(--serif);font-size:44px;font-weight:700;color:var(--deep)}
.podium .p1 .blk{height:200px;background:var(--yellow)}.podium .p2 .blk{height:150px;background:#cfe0dc}.podium .p3 .blk{height:110px;background:#ffc3a3}
.podium .nm{font-size:24px;font-weight:800;margin-bottom:8px}.podium .pt{font-size:16px;color:#cfe0dc}
.slot{height:150px;border-radius:22px;background:var(--deep2);border:3px dashed rgba(255,226,138,.4);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:700;color:var(--yellow);text-align:center;padding:10px}
.slot.hit{border:3px solid var(--yellow);animation:pop .5s ease}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:900px){.hgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="net" id="net">연결이 잠시 늦어지고 있어요…</div>

<script>
/* ===== 설정 ===== */
const API = "https://script.google.com/macros/s/AKfycbyqen0mrwEzsWppMRo0IvxHkBLLmVqDeGLJ1G9aQfvPBwEe2ypBfAk3IHKwIPq5_2r6/exec";
const DUR = 15;   // 문제당 제한 시간(초)
const Q = [
  { q:"책자 표지의 ‘100’ 로고, 두 개의 ‘0’은 어떤 기호를 닮았을까요?", o:["하트 ♥","무한대 ∞","안경 👓","자물쇠 🔒"], a:1,
    n:"“100개의 배움이 이어져, 100개의 성장이 됩니다.” 끝없이 이어지는 ∞ 모양이 책 곳곳에 숨어 있어요." },
  { q:"부천의 고등학교는 모두 몇 곳일까요?", o:["21곳","24곳","29곳","32곳"], a:2,
    n:"일반고·자율고 24교, 특목고 1교, 특성화고 4교. 29개 학교, 29개의 빛깔로 저마다의 강점을 살린 교육과정을 운영해요." },
  { ox:1, t:10, q:"교과특성화학교는 지정된 뒤 3년 동안 운영한다.", o:["맞아요","아니에요"], a:0,
    n:"교과특성화학교는 지정 후 3년 동안 운영합니다. 2024·2025·2026 지정 학교가 함께 있어요." },
  { ox:1, t:10, q:"고등학교 교육활동 모아보기 「학교를 만나고, 배움을 그리다」 e북에는 부천 29개 고등학교가 모두 담겨 있다.", o:["맞아요","아니에요"], a:0,
    n:"일반고·자율고, 특목고, 특성화고까지 29개 학교의 교육활동을 한 권에 담았어요. 배움100이음 사이트에서 바로 볼 수 있어요." },
  { q:"2026 정규학기 부천형 공동교육과정, 열린 강좌는 모두 몇 개일까요?", o:["37강좌","47강좌","57강좌","67강좌"], a:1,
    n:"1학기 24강좌 + 2학기 23강좌 = 47강좌. 727명의 학생이 학교를 넘어 함께 배웠어요." },
  { q:"다음 중 2026 공동교육과정에 열리지 ‘않은’ 과목은?", o:["보건","국제 정치","교육의 이해","천문학"], a:3,
    n:"보건·국제 정치·교육의 이해는 모두 열렸어요. 인공지능 수학, 고급 생명과학, 소설 창작까지 47강좌가 함께했습니다." },
  { q:"부천이 ‘경기도 최초’로 운영한 것은 무엇일까요?", o:["공동교육과정 계절학기","고교학점제 박람회","온라인 학교","AI 디지털교과서"], a:0,
    n:"학기가 끝나도 배움은 계속됩니다. 겨울방학 14강좌 221명, 여름방학 3강좌 35명이 방학에도 배웠어요." },
  { q:"나눔캠퍼스로 부천 학생들과 함께하는 대학은 몇 곳일까요?", o:["2곳","3곳","4곳","5곳"], a:3,
    n:"부천시·부천교육지원청과 5개 대학이 함께 만드는 열린 배움터. 도시가 배움터가 됩니다." },
  { q:"경기신문이 “학교 간 울타리 넘어 교육 잇는다”며 ‘눈길’이라고 소개한 부천의 교육은?", o:["부천형 공동교육과정","AI 디지털교과서","학교 급식 개선","진로 박람회"], a:0,
    n:"2026. 8. 21. 경기신문 대표기사. 정규학기를 넘어 방학까지 과목 선택과 이수 기회를 넓힌 부천형 모델이 소개됐어요." },
  { q:"공동교육과정 ‘보건’ 선생님은 몇 번의 수업을 했을까요?", o:["16번","24번","32번","40번"], a:2,
    n:"“서른두 번의 수업 끝에 가장 많이 자란 사람은 저였습니다.” 배움을 만드는 교사도 함께 성장해요." }
];
const L = ["A","B","C","D"];
const LB = (x,k) => x.ox ? ["O","X"][k] : L[k];


/* ===== 도우미 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function jsonp(params, ms=9000){
  return new Promise((ok, no) => {
    const cb = "__q" + Date.now() + Math.floor(Math.random()*1e5), sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); no(new Error("timeout")); }, ms);
    window[cb] = d => { done(); ok(d); };
    sc.onerror = () => { done(); no(new Error("load")); };
    sc.src = API + "?" + new URLSearchParams({ ...params, callback: cb, t: Date.now() });
    document.head.appendChild(sc);
  });
}
async function post(body){
  const opt = { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body) };
  try{ const r = await fetch(API, opt); return await r.json(); }
  catch(e){ await fetch(API, { ...opt, mode:"no-cors" }); return { ok:true, blind:true }; }
}
let actx=null;
function beep(f,d){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d); o.stop(actx.currentTime+d+.02); }catch(e){} }
function confetti(n=80){ const cs=["#ffe28a","#5fa3a0","#c2571f","#cbbcf0","#9fd6d2"];
  for(let i=0;i<n;i++){ const c=document.createElement("i"); c.className="conf"; c.style.left=Math.random()*100+"vw"; c.style.background=cs[i%cs.length];
    c.style.animationDuration=(2+Math.random()*2)+"s"; c.style.animationDelay=Math.random()*.6+"s"; document.body.appendChild(c); setTimeout(()=>c.remove(),5000); } }
let skew = 0;  // 서버시각 - 내시각
const left = st => Math.max(0, st.dur - ((Date.now() + skew) - st.t0) / 1000);

/* ===== 참여자 ===== */
const me = JSON.parse(store.get("qz.me") || "null") || { id: Math.random().toString(36).slice(2,9), nick:"", joined:false, picks:{} };
const save = () => store.set("qz.me", JSON.stringify(me));
let st = null, view = "", pollT = null, tickT = null, fails = 0;

function vJoin(){
  view = "join";
  $("#app").innerHTML = `<div class="top"><span class="pill">1부 · 다 함께</span></div>
    <h1>부천 배움 100이음<br><em>고등학교 STORY</em> 퀴즈</h1>
    <p class="lead">화면과 함께 문제가 바뀌어요. 빨리, 정확하게 맞힐수록 점수가 올라가요!</p>
    <div class="card"><label for="nick">닉네임 (학교명이나 별명)</label><input id="nick" maxlength="12" placeholder="예: 부천○○고 국어쌤" value="${esc(me.nick)}">
    <button class="btn" id="go">입장하기</button><p class="muted" id="jm" style="color:#c2571f;margin:10px 0 0"></p></div>`;
  $("#go").onclick = async () => {
    const v = $("#nick").value.trim(); if (!v){ $("#nick").focus(); return; }
    me.nick = v; save(); $("#go").disabled = true; $("#jm").textContent = "";
    try{ const d = await post({ action:"qjoin", id:me.id, nick:v }); if (!d.ok) throw new Error(d.error); me.joined = true; save(); poll(true); }
    catch(e){ $("#jm").textContent = "입장이 늦어지고 있어요. 다시 눌러 주세요."; $("#go").disabled = false; }
  };
}
function head(){ return `<div class="top"><span class="pill">${esc(me.nick)}</span><span>${st && st.players ? `참여 <b>${st.players}</b>명` : ""}</span></div>`; }
function vLobby(){
  view = "lobby";
  $("#app").innerHTML = head() + `<div class="center"><div class="cup">☕</div><div style="font-size:22px;font-weight:800">입장 완료!</div>
    <p class="muted">화면에서 첫 문제가 시작되면<br>이 화면도 저절로 바뀌어요.</p></div>`;
}
function vAsk(){
  const q = st.q, x = Q[q], mine = me.picks[q];
  if (view !== "ask"+q){
    view = "ask"+q;
    $("#app").innerHTML = head() + `<div class="qn"><span>문제 ${q+1} / ${Q.length}</span><span id="sec"></span></div>
      <div class="bar" id="bar"><i id="bi"></i></div><div class="qt">${esc(x.q)}</div>
      <div class="opts">${x.o.map((o,k)=>`<button class="opt o${k}" data-k="${k}"><span class="l">${LB(x,k)}</span>${esc(o)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>`;
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
    beep(660,.12);
  }
  paintAsk();
}
function paintAsk(){
  const q = st.q, mine = me.picks[q], s = left(st);
  const bi = $("#bi"); if (!bi) return;
  bi.style.width = (s/st.dur*100)+"%"; $("#bar").classList.toggle("low", s<=5); $("#sec").textContent = Math.ceil(s)+"초";
  document.querySelectorAll(".opt").forEach(b => { const k=+b.dataset.k; b.disabled = mine!=null || s<=0; b.classList.toggle("pick", mine===k); b.classList.toggle("dim", mine!=null && mine!==k); });
  $("#fb").innerHTML = mine!=null ? `제출했어요! <small>정답 공개를 기다려 주세요</small>` : s<=0 ? `시간이 끝났어요 <small>다음 문제를 기다려 주세요</small>` : "";
}
async function answer(k){
  const q = st.q; if (me.picks[q]!=null || left(st)<=0) return;
  me.picks[q] = k; save(); beep(520,.08); paintAsk();
  try{ await post({ action:"qans", id:me.id, q, k }); }catch(e){}
}
function vReveal(){
  const q = st.q, x = Q[q], mine = me.picks[q], ok = mine === st.key;
  if (view === "rev"+q){ paintRank(); return; }
  view = "rev"+q;
  $("#app").innerHTML = head() + `<div class="qn"><span>문제 ${q+1} / ${Q.length}</span><span>정답 공개</span></div><div class="qt">${esc(x.q)}</div>
    <div class="opts">${x.o.map((o,k)=>`<button class="opt o${k} ${k===st.key?"right":mine===k?"wrong":"dim"}" disabled><span class="l">${LB(x,k)}</span>${esc(o)}</button>`).join("")}</div>
    <div class="fb">${mine==null ? `<span class="burst">⏰</span>이번 문제는 놓쳤어요` : ok ? `<span class="burst">🎉</span>정답!` : `<span class="burst">🫶</span>아쉬워요!`}<div id="rk"></div></div>`;
  if (ok){ beep(880,.2); confetti(30); } else beep(300,.2);
  paintRank();
}
function paintRank(){ const r = $("#rk"); if (r && st.rank) r.innerHTML = `<span class="rank">${st.total}명 중 ${st.rank}위 · ${st.pts}점</span>`; }
function vResult(){
  if (view === "result"){ paintRank(); return; }
  view = "result";
  const top3 = st.rank && st.rank <= 3;
  $("#app").innerHTML = head() + `<div class="center"><p class="muted">STORY 퀴즈 끝!</p>
    <div class="big">${st.rank ? st.rank+"위" : "수고했어요"}</div>
    <p style="font-size:20px;font-weight:800">${st.rank ? `${st.total}명 중 · ${st.pts}점 · ${st.right}문제 정답` : ""}</p>
    <p style="font-size:18px">${top3 ? "🏆 시상대에 올랐어요! 앞으로 나와 주세요" : "이제 마음 가는 테이블로 이동해요 ☕"}</p><div id="rk"></div>
    <p class="muted" style="margin-top:20px">내 자리와 메뉴는 <a href="cafe.html#menu" style="color:#ffe28a">카페 안내 페이지</a>에서 확인하세요.</p></div>`;
  if (top3){ confetti(120); beep(880,.3); }
}
function render(){
  if (!me.joined) return view==="join" ? null : vJoin();
  if (!st || st.phase === "lobby" || st.q < 0) return vLobby();
  if (st.phase === "ask") return vAsk();
  if (st.phase === "reveal") return vReveal();
  if (st.phase === "result") return vResult();
}
async function poll(now){
  clearTimeout(pollT);
  try{
    const t0 = Date.now(), d = await jsonp({ action:"qstate", id: me.id });
    if (d.ok){ skew = d.now - (t0 + Date.now())/2; st = d; fails = 0; $("#net").classList.remove("on");
      if (d.joined === false && me.nick){ try{ await post({ action:"qjoin", id:me.id, nick:me.nick }); }catch(e){} }   // 초기화 뒤 자동 재입장
      if (d.phase === "lobby" && Object.keys(me.picks).length && d.joined === false){ me.picks = {}; save(); view = ""; }
      render(); }
  }catch(e){ if (++fails > 2) $("#net").classList.add("on"); }
  pollT = setTimeout(poll, st && st.phase === "ask" ? 1500 : 2500);
}

/* ===== 진행자 (#host) ===== */
let H = { pin: store.get("qz.pin") || "", q: -1, phase: "lobby", all: null };
async function hostCmd(body){
  const d = await post({ action:"qhost", pin:H.pin, ...body });
  if (d && d.ok === false && d.error === "PIN"){ alertPin(); throw new Error("PIN"); }
  return d;
}
function alertPin(){ H.pin = ""; store.set("qz.pin",""); vPin("PIN이 맞지 않아요."); }
function vPin(msg){
  $("#app").innerHTML = `<div class="center" style="max-width:420px;margin:0 auto"><h1>진행자 화면</h1>
    <div class="card" style="width:100%"><label for="pin">진행자 PIN</label><input id="pin" inputmode="numeric" maxlength="8">
    <button class="btn" id="pgo">들어가기</button><p class="muted" style="color:#c2571f">${esc(msg||"")}</p></div></div>`;
  $("#pgo").onclick = () => { H.pin = $("#pin").value.trim(); store.set("qz.pin", H.pin); hLobby(); };
}
function sideQR(extra){ return `<div class="side"><div class="qr"><img src="qr-quiz.png" alt="퀴즈 참여 QR"></div><p><b>휴대폰으로 참여</b><br>sin-nari.github.io/baeum/quiz.html</p>${extra||""}</div>`; }
async function hLobby(){
  H.phase = "lobby"; H.q = -1;
  $("#app").innerHTML = `<div class="top"><span class="pill">1부 · 다 함께, 한자리에서</span><span>15:35</span></div>
    <div class="hgrid"><div><div class="title-h">부천 배움 100이음<br><em>고등학교 STORY</em></div>
      <p class="lead" style="font-size:22px">QR을 찍고 닉네임으로 입장해 주세요. 다섯 문제로 부천 고등학교 교육과정 이야기를 함께 풀어 봅니다.</p>
      <div class="bubbles" id="bub"></div>
      <div class="ctl"><button class="main" id="start">퀴즈 시작 ▶</button><button class="sm" id="reset">처음부터(초기화)</button></div></div>
      ${sideQR(`<div class="count" id="pc">0</div><p>명 입장</p>`)}</div>`;
  $("#start").onclick = () => hAsk(0);
  $("#reset").onclick = async () => { if (!confirm("참여자와 답안을 모두 지우고 처음부터 시작할까요?")) return; await hostCmd({ op:"reset" }); hLobby(); };
  try{ await hostCmd({ op:"lobby", n:Q.length }); }catch(e){ return; }
  hostPoll();
}
async function hAsk(q){
  H.q = q; H.phase = "ask";
  try{ const d = await hostCmd({ op:"ask", q, dur:(Q[q].t||DUR) }); if (d.state) { H.t0 = d.state.t0; } }catch(e){ return; }
  const x = Q[q]; beep(660,.15);
  $("#app").innerHTML = `<div class="top"><span class="pill">부천 배움 100이음 · 고등학교 STORY</span><span style="font-size:20px">문제 <b>${q+1}</b> / ${Q.length}</span></div>
    <div class="hgrid"><div><div class="qt">${esc(x.q)}</div>
      <div class="opts">${x.o.map((o,k)=>`<div class="opt o${k}"><span class="l">${LB(x,k)}</span>${esc(o)}</div>`).join("")}</div>
      <div class="ctl"><button class="main" id="rev">정답 공개</button></div></div>
      <div class="side"><div class="ring" id="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="65" class="bg"/><circle cx="75" cy="75" r="65" class="fg" id="fg"/></svg><b id="sec">${DUR}</b></div>
        <div class="count" id="ac">0</div><p>명 답했어요 · <span id="pc2">0</span>명 참여</p></div></div>`;
  $("#rev").onclick = () => hReveal(q);
  hostPoll();
}
function hTick(){
  if (H.phase !== "ask" || !H.st) return;
  const s = left(H.st), fg = $("#fg"); if (!fg) return;
  fg.style.strokeDashoffset = 408 * (1 - s/H.st.dur); $("#sec").textContent = Math.ceil(s); $("#ring").classList.toggle("low", s<=5);
  if (s<=0 && !H.ended){ H.ended = true; beep(440,.3); $("#sec").textContent = "끝"; }
}
async function hReveal(q){
  H.phase = "reveal"; H.ended = false;
  try{ await hostCmd({ op:"reveal", key:Q[q].a }); }catch(e){ return; }
  const x = Q[q]; beep(880,.2);
  let all = null; try{ all = await jsonp({ action:"qall", pin:H.pin }); }catch(e){}
  const ans = all && all.answers ? Object.values(all.answers[q] || {}) : [];
  const cnt = x.o.map((_,k)=>k).map(k => ans.filter(a => a[0]===k).length), mx = Math.max(1, ...cnt);
  const rk = all && all.ranking ? all.ranking.slice(0,5) : [];
  $("#app").innerHTML = `<div class="top"><span class="pill">부천 배움 100이음 · 고등학교 STORY</span><span style="font-size:20px">문제 <b>${q+1}</b> / ${Q.length}</span></div>
    <div class="hgrid"><div><div class="qt">${esc(x.q)}</div>
      <div class="opts">${x.o.map((o,k)=>`<div class="opt o${k} ${k===x.a?"right":"dim"}"><span class="l">${LB(x,k)}</span>${esc(o)}</div>`).join("")}</div>
      <div class="note">정답 <b style="color:#ffe28a">${LB(x,x.a)}. ${esc(x.o[x.a])}</b><br>${esc(x.n)}</div>
      <div class="ctl"><button class="main" id="nx">${q===Q.length-1 ? "최종 결과 ▶" : "다음 문제 ▶"}</button></div></div>
      <div class="side"><p style="margin-top:0"><b>모두의 선택</b></p><div class="dist">${cnt.map((c,k)=>`<div class="${k===x.a?"ok":""}"><span>${LB(x,k)}</span><i style="width:${c/mx*100}%"></i><span>${c}명</span></div>`).join("")}</div>
        <p style="margin-top:16px"><b>지금 순위 TOP 5</b></p><ol class="board">${rk.map((r,i)=>`<li><b>${i+1}</b><span>${esc(r.nick)}</span><span>${r.pts}점</span></li>`).join("") || "<li><span></span><span>아직 없어요</span></li>"}</ol></div></div>`;
  $("#nx").onclick = () => q === Q.length-1 ? hResult() : hAsk(q+1);
}
async function hResult(){
  H.phase = "result";
  try{ await hostCmd({ op:"result" }); }catch(e){ return; }
  let all = null; try{ all = await jsonp({ action:"qall", pin:H.pin }); }catch(e){}
  const r = all && all.ranking ? all.ranking : [];
  const p = [r[1], r[0], r[2]];
  $("#app").innerHTML = `<div class="top"><span class="pill">부천 배움 100이음 · 고등학교 STORY</span><span>참여 <b>${r.length}</b>명</span></div>
    <div class="hgrid"><div><div class="title-h" style="margin-top:6px">오늘의 <em>STORY 챔피언</em></div>
      <div class="podium">${p.map((x,i)=>`<div class="${["p2","p1","p3"][i]}">${x?`<div class="nm">${esc(x.nick)}</div><div class="pt">${x.pts}점 · ${x.right}문제</div>`:""}<div class="blk">${[2,1,3][i]}</div></div>`).join("")}</div>
      <div class="ctl"><button class="or" id="saveR">결과를 시트에 저장</button><button id="back">◀ 마지막 문제</button><button class="sm" id="toL">대기 화면</button></div><p class="muted" id="sv"></p></div>
      <div class="side"><p style="margin-top:0"><b>경품 추첨</b><br>정답자 중에서 뽑아요</p><div class="slot" id="slot">🎁</div>
        <div class="ctl" style="justify-content:center"><button class="main" id="drw">추첨!</button></div><ol class="board" id="wins"></ol></div></div>`;
  confetti(140); beep(880,.3);
  const top = r.length ? Math.max(...r.map(x=>x.right)) : 0;
  let pool = r.filter(x => x.right === top && top > 0), won = [];
  $("#drw").disabled = !pool.length;
  $("#drw").onclick = () => {
    const cand = pool.filter(x => !won.includes(x)); if (!cand.length) return;
    const pick = cand[Math.floor(Math.random()*cand.length)]; $("#drw").disabled = true; $("#slot").classList.remove("hit");
    let n=0; (function t(){ n++; $("#slot").textContent = (n<22 ? cand[n%cand.length] : pick).nick; beep(n<22?520:880, n<22?.03:.25);
      if (n<22) setTimeout(t, 45+n*n*.9); else { $("#slot").classList.add("hit"); won.push(pick); confetti(60);
        $("#wins").innerHTML = won.map((w,i)=>`<li><b>🎁</b><span>${esc(w.nick)}</span><span></span></li>`).join(""); $("#drw").disabled = won.length >= pool.length; } })();
  };
  $("#saveR").onclick = async () => { $("#sv").textContent = "저장 중…"; try{ const d = await hostCmd({ op:"save" }); $("#sv").textContent = d.blind ? "저장을 요청했어요. 시트 '퀴즈' 탭을 확인하세요." : `‘퀴즈’ 시트에 ${d.saved}명 저장했어요.`; }catch(e){ $("#sv").textContent = "저장하지 못했어요. 다시 눌러 주세요."; } };
  $("#back").onclick = () => hReveal(Q.length-1);
  $("#toL").onclick = hLobby;
}
async function hostPoll(){
  clearTimeout(pollT);
  if (!["lobby","ask"].includes(H.phase)) return;
  try{
    const t0 = Date.now(), d = await jsonp({ action:"qstate" });
    if (d.ok){ skew = d.now - (t0 + Date.now())/2; H.st = d; $("#net").classList.remove("on");
      if (H.phase === "lobby"){ const pc = $("#pc"); if (pc) pc.textContent = d.players || 0;
        try{ const a = await jsonp({ action:"qall", pin:H.pin }); const names = Object.values(a.players || {}); const b = $("#bub"); if (b) b.innerHTML = names.slice(-60).map(n=>`<span>${esc(n)}</span>`).join(""); }catch(e){} }
      if (H.phase === "ask"){ const ac = $("#ac"); if (ac) ac.textContent = d.answered || 0; const p2 = $("#pc2"); if (p2) p2.textContent = d.players || 0; }
    }
  }catch(e){ $("#net").classList.add("on"); }
  pollT = setTimeout(hostPoll, 2000);
}

/* ===== 시작 ===== */
function start(){
  clearTimeout(pollT);
  if (location.hash === "#host"){ document.body.classList.add("host"); H.pin ? hLobby() : vPin(); }
  else { document.body.classList.remove("host"); me.joined ? poll(true) : vJoin(); }
}
setInterval(() => { if (document.body.classList.contains("host")) hTick(); else if (st && st.phase === "ask") paintAsk(); }, 250);
window.addEventListener("hashchange", start);
start();
</script>
</body>
</html>
