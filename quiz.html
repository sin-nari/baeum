<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배움 100이음 STORY 퀴즈 · 이야기 카페</title>
<meta name="theme-color" content="#1d3a40">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--deep:#1d3a40;--deep2:#24494d;--yellow:#ffe28a;--orange:#c2571f;--teal:#5fa3a0;--cream:#fbf8f0;--paper:#f4ecd8;--ink:#1d2b2f;--muted:#5b6b6e;--line:#e3dccb;
  --serif:"Gowun Batang",serif;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--deep);color:#fff;font-family:var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.app{max-width:520px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#cfe0dc}
.top b{color:var(--yellow)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--yellow)}.dots i.ok{background:var(--teal)}.dots i.no{background:var(--orange)}
h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.25;margin:26px 0 8px}
h1 em{font-style:normal;color:var(--yellow)}
.lead{color:#cfe0dc;font-size:16px;line-height:1.6;margin:0 0 22px}
.card{background:#fff;color:var(--ink);border-radius:24px;padding:22px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--cream)}
input:focus{outline:none;border-color:var(--teal)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800;background:var(--orange);color:#fff;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.y{background:var(--yellow);color:var(--deep)}
.qn{font-size:15px;font-weight:800;color:var(--yellow);margin-top:24px}
.qt{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.35;margin:8px 0 20px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:700;color:#fff;background:var(--deep2);border:2px solid rgba(255,255,255,.12);transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt .l{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:var(--deep)}
.opt:nth-child(1) .l{background:#ffe28a}.opt:nth-child(2) .l{background:#9fd6d2}.opt:nth-child(3) .l{background:#ffc3a3}.opt:nth-child(4) .l{background:#cbbcf0}
.opt.pick{border-color:var(--yellow);background:#2f5a5f}
.opt.right{border-color:#8fe0a8;background:#245a3e}.opt.wrong{border-color:#ff9f7a;background:#5a2f24}
.fb{min-height:64px;margin-top:16px;font-size:18px;font-weight:800;text-align:center}
.fb small{display:block;font-weight:500;color:#cfe0dc;font-size:14px;margin-top:6px;line-height:1.5}
.burst{font-size:44px;display:block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.done{text-align:center;margin-top:30px}
.score{font-family:var(--serif);font-size:84px;color:var(--yellow);line-height:1;margin:10px 0}
.score small{font-size:30px;color:#cfe0dc}
.muted{color:#9fb8b4;font-size:14px;line-height:1.6}
.msg{min-height:1.5em;font-size:14px;margin-top:10px;color:var(--yellow)}

/* 진행자(무대) 화면 */
body.host .app{max-width:none;padding:28px 44px}
body.host h1{font-size:46px}
.hq{display:grid;grid-template-columns:1fr 300px;gap:28px;margin-top:18px;align-items:start}
.hq .qt{font-size:44px;margin:6px 0 24px}
.hq .opts{grid-template-columns:1fr 1fr;gap:16px}
.hq .opt{font-size:30px;padding:22px 24px;cursor:default}
.hq .opt .l{width:54px;height:54px;font-size:26px}
.side{background:var(--deep2);border-radius:24px;padding:22px;text-align:center}
.qr{background:#fff;border-radius:16px;padding:10px}
.qr img{width:100%}
.side p{margin:10px 0 0;color:#cfe0dc;font-size:16px}
.side b{color:var(--yellow);font-size:20px}
.note{margin-top:22px;background:rgba(255,226,138,.12);border-left:6px solid var(--yellow);border-radius:12px;padding:16px 20px;font-size:22px;line-height:1.6;color:#fff}
.ctl{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.ctl button{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;background:var(--deep2);color:#fff}
.ctl button.main{background:var(--yellow);color:var(--deep)}
.ctl button.or{background:var(--orange);color:#fff}
.res{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;margin-top:20px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 60px;gap:12px;align-items:center;font-size:20px}
.bar i{display:block;height:28px;border-radius:8px;background:var(--teal);transition:width .8s}
.bar.top i{background:var(--yellow)}
.winners{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.winners span{background:var(--deep2);border-radius:999px;padding:6px 14px;font-size:18px}
.winners span.win{background:var(--yellow);color:var(--deep);font-weight:900}
.slot{height:200px;border-radius:22px;background:var(--deep2);border:3px dashed rgba(255,226,138,.4);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:56px;font-weight:700;color:var(--yellow);text-align:center;padding:10px}
.slot.hit{border:3px solid var(--yellow);animation:pop .5s ease}
@media (max-width:900px){.hq,.res{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===== 설정 ===== */
const API = "https://script.google.com/macros/s/AKfycbyqen0mrwEzsWppMRo0IvxHkBLLmVqDeGLJ1G9aQfvPBwEe2ypBfAk3IHKwIPq5_2r6/exec";
const JOIN_URL = "https://sin-nari.github.io/baeum/quiz.html";
const Q = [
  { q:"부천의 고등학교는 모두 몇 곳일까요?", o:["18곳","21곳","24곳","29곳"], a:2,
    n:"24개 학교, 24개의 빛깔. 학교마다 서로 다른 강점으로 교육과정을 특성화하고 있어요." },
  { q:"2026 정규학기 부천형 공동교육과정, 열린 강좌는 모두 몇 개일까요?", o:["37강좌","47강좌","57강좌","67강좌"], a:1,
    n:"1학기 24강좌 + 2학기 23강좌 = 47강좌. 727명의 학생이 학교를 넘어 함께 배웠어요." },
  { q:"부천이 ‘경기도 최초’로 운영한 것은 무엇일까요?", o:["공동교육과정 계절학기","고교학점제 박람회","온라인 학교","AI 디지털교과서"], a:0,
    n:"학기가 끝나도 배움은 계속됩니다. 겨울 14강좌 221명, 여름 3강좌 35명이 방학에도 배웠어요." },
  { q:"나눔캠퍼스로 부천 학생들과 함께하는 대학은 몇 곳일까요?", o:["2곳","3곳","4곳","5곳"], a:3,
    n:"부천시와 5개 대학이 함께 만드는 열린 배움터. 학교를 넘어 도시가 배움터가 됩니다." },
  { q:"공동교육과정 계절학기 ‘보건’ 선생님은 몇 번의 수업을 했을까요?", o:["16번","24번","32번","40번"], a:2,
    n:"“서른두 번의 수업 끝에 가장 많이 자란 사람은 저였습니다.” 배움을 만드는 교사도 함께 성장해요." }
];
const L = ["A","B","C","D"];

/* ===== 도우미 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function jsonp(url, ms=15000){
  return new Promise((ok, no) => {
    const cb = "__q" + Date.now() + Math.floor(Math.random()*1e4), sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); no(new Error("timeout")); }, ms);
    window[cb] = d => { done(); ok(d); };
    sc.onerror = () => { done(); no(new Error("load")); };
    sc.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
    document.head.appendChild(sc);
  });
}
async function post(body){
  const opt = { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body) };
  try{ const r = await fetch(API, opt); return await r.json(); }
  catch(e){ await fetch(API, { ...opt, mode:"no-cors" }); return { ok:true, blind:true }; }
}
let actx=null;
function beep(f,d){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d); o.stop(actx.currentTime+d+.02); }catch(e){} }

/* ===== 참여자 화면 ===== */
const me = JSON.parse(store.get("quiz.me") || "null") || { id: Math.random().toString(36).slice(2,8), nick:"", ans:[], sent:false };
function save(){ store.set("quiz.me", JSON.stringify(me)); }
function dots(){ return `<div class="dots">${Q.map((_,i)=>`<i class="${i<me.ans.length ? (me.ans[i]===Q[i].a?"ok":"no") : i===me.ans.length?"on":""}"></i>`).join("")}</div>`; }
function viewJoin(){
  $("#app").innerHTML = `<div class="top"><span>이야기 카페 · <b>1부</b></span></div>
    <h1>배움 100이음<br><em>STORY 퀴즈</em></h1>
    <p class="lead">화면에 문제가 나오면 휴대폰으로 답해 주세요. 다섯 문제를 모두 맞히면 마지막에 경품 추첨에 들어가요!</p>
    <div class="card"><label for="nick">닉네임 (학교명이나 별명)</label><input id="nick" maxlength="12" placeholder="예: 부천○○고 국어쌤" value="${esc(me.nick)}">
    <button class="btn" id="go">입장하기</button></div>`;
  $("#go").onclick = () => { const v = $("#nick").value.trim(); if (!v){ $("#nick").focus(); return; } me.nick = v; save(); route(); };
}
function viewQ(){
  const i = me.ans.length, x = Q[i];
  $("#app").innerHTML = `<div class="top"><span>${esc(me.nick)}</span>${dots()}</div>
    <div class="qn">문제 ${i+1} / ${Q.length}</div><div class="qt">${esc(x.q)}</div>
    <div class="opts">${x.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span>${esc(o)}</button>`).join("")}</div>
    <div class="fb" id="fb" aria-live="polite"><small>화면의 문제와 같은 번호인지 확인하고 골라 주세요</small></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (me.ans.length > i) return;
    const k = +b.dataset.k; me.ans.push(k); save();
    document.querySelectorAll(".opt").forEach(o => { o.disabled = true; const kk=+o.dataset.k; if (kk===x.a) o.classList.add("right"); else if (kk===k) o.classList.add("wrong"); });
    const ok = k === x.a; beep(ok?880:300, ok?.2:.25);
    $("#fb").innerHTML = ok ? `<span class="burst">🎉</span>정답이에요!` : `<span class="burst">🫶</span>아쉬워요! 정답은 ${L[x.a]}`;
    setTimeout(route, 1700);
  });
}
async function viewDone(){
  const sc = me.ans.filter((k,i)=>k===Q[i].a).length;
  $("#app").innerHTML = `<div class="top"><span>${esc(me.nick)}</span>${dots()}</div>
    <div class="done"><p class="muted">다섯 문제를 모두 풀었어요</p><div class="score">${sc}<small> / ${Q.length}</small></div>
    <p style="font-size:20px;font-weight:800">${sc===Q.length ? "만점! 추첨을 기다려 주세요 🎁" : "멋져요! 이제 카페로 출발 ☕"}</p>
    <p class="msg" id="msg">답안을 보내는 중…</p>
    <button class="btn y" id="retry" hidden>다시 보내기</button>
    <p class="muted" style="margin-top:28px">2부 이야기 카페 메뉴와 내 자리는<br><a href="cafe.html#menu" style="color:#ffe28a">카페 안내 페이지</a>에서 확인하세요.</p></div>`;
  if (me.sent){ $("#msg").textContent = "답안이 전달되었어요 ✓"; return; }
  const send = async () => {
    $("#retry").hidden = true; $("#msg").textContent = "답안을 보내는 중…";
    try{
      const d = await post({ action:"add", round:1, table:1, school:me.nick.slice(0,20), text:`[quiz] ${me.id}|${me.ans.join("")}|${me.nick}` });
      if (!d.ok) throw new Error(d.error);
      me.sent = true; save(); $("#msg").textContent = "답안이 전달되었어요 ✓";
    }catch(e){ $("#msg").textContent = "전송이 늦어지고 있어요. 다시 보내 주세요."; $("#retry").hidden = false; }
  };
  $("#retry").onclick = send; send();
}
function route(){ if (!me.nick) return viewJoin(); if (me.ans.length < Q.length) return viewQ(); viewDone(); }

/* ===== 진행자(무대) 화면: quiz.html#host ===== */
let h = { i: 0, reveal: false };
function viewHost(){
  document.body.classList.add("host");
  if (h.i >= Q.length) return viewResult();
  const x = Q[h.i];
  $("#app").innerHTML = `<div class="top"><span>부천 배움 100이음 · <b>STORY 퀴즈</b></span><span style="font-size:20px">문제 <b>${h.i+1}</b> / ${Q.length}</span></div>
    <div class="hq"><div><div class="qt">${esc(x.q)}</div>
      <div class="opts">${x.o.map((o,k)=>`<div class="opt ${h.reveal ? (k===x.a?"right":"") : ""}"><span class="l">${L[k]}</span>${esc(o)}</div>`).join("")}</div>
      ${h.reveal ? `<div class="note">정답 <b style="color:#ffe28a">${L[x.a]}. ${esc(x.o[x.a])}</b><br>${esc(x.n)}</div>` : ""}
      <div class="ctl"><button id="prev">◀ 이전</button>${h.reveal ? `<button class="main" id="next">${h.i===Q.length-1?"결과 보기 ▶":"다음 문제 ▶"}</button>` : `<button class="main" id="show">정답 공개</button>`}</div></div>
      <div class="side"><div class="qr"><img src="qr-quiz.png" alt="퀴즈 참여 QR"></div>
      <p><b>휴대폰으로 참여</b><br>QR을 찍고 닉네임만 넣으면 돼요</p></div></div>`;
  $("#prev").onclick = () => { if (h.reveal) h.reveal=false; else if (h.i>0){ h.i--; h.reveal=true; } viewHost(); };
  const s = $("#show"); if (s) s.onclick = () => { h.reveal = true; beep(880,.2); viewHost(); };
  const n = $("#next"); if (n) n.onclick = () => { h.i++; h.reveal = false; viewHost(); };
}
let res = null;
async function viewResult(){
  $("#app").innerHTML = `<div class="top"><span>부천 배움 100이음 · <b>STORY 퀴즈 결과</b></span><span id="cnt"></span></div>
    <h1>누가 <em>만점</em>일까요?</h1>
    <div class="res"><div><div class="bars" id="bars"><p class="muted">답안을 모으는 중…</p></div>
      <div class="ctl"><button id="reload">↻ 다시 모으기</button><button id="back">◀ 문제로</button></div></div>
      <div><div class="slot" id="slot">🎁</div><div class="ctl" style="justify-content:center"><button class="or" id="draw">경품 추첨</button></div>
      <p class="muted" id="pool" style="text-align:center"></p><div class="winners" id="wins"></div></div></div>`;
  $("#back").onclick = () => { h.i = Q.length-1; h.reveal = true; viewHost(); };
  $("#reload").onclick = load;
  $("#draw").onclick = draw;
  await load();
}
async function load(){
  try{
    const d = await jsonp(API);
    const by = {};
    d.cards.filter(c => /^\[quiz\] /.test(c.text)).forEach(c => {
      const [id, ans, ...nk] = c.text.slice(7).split("|");
      if (!by[id] || (c.at||0) > (by[id].at||0)) by[id] = { id, ans, nick: nk.join("|") || c.school, at: c.at };
    });
    const ppl = Object.values(by).map(p => ({ ...p, score: [...p.ans].filter((k,i)=>+k===Q[i]?.a).length }));
    res = { ppl, won: res ? res.won : [] };
    $("#cnt").innerHTML = `참여 <b>${ppl.length}</b>명`;
    const dist = [5,4,3,2,1,0].map(s => ({ s, n: ppl.filter(p=>p.score===s).length }));
    const max = Math.max(1, ...dist.map(x=>x.n));
    $("#bars").innerHTML = dist.map(x => `<div class="bar ${x.s===Q.length?"top":""}"><span>${x.s}개 정답</span><i style="width:${x.n/max*100}%"></i><span>${x.n}명</span></div>`).join("");
    drawPool();
  }catch(e){ $("#bars").innerHTML = `<p class="muted">답안을 불러오지 못했어요. ‘다시 모으기’를 눌러 주세요.</p>`; }
}
function poolList(){ if (!res) return []; const top = Math.max(0, ...res.ppl.map(p=>p.score)); return res.ppl.filter(p => p.score === top && top > 0 && !res.won.includes(p.id)); }
function drawPool(){
  const pool = poolList(), top = res && res.ppl.length ? Math.max(...res.ppl.map(p=>p.score)) : 0;
  $("#pool").textContent = pool.length ? `${top===Q.length?"만점자":top+"개 정답자"} ${pool.length}명 중에서 뽑아요` : "추첨할 사람이 없어요";
  $("#wins").innerHTML = res.won.map(id => `<span class="win">🎁 ${esc(res.ppl.find(p=>p.id===id)?.nick||"")}</span>`).join("") + pool.slice(0,40).map(p=>`<span>${esc(p.nick)}</span>`).join("");
  $("#draw").disabled = !pool.length;
}
function draw(){
  const pool = poolList(); if (!pool.length) return;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  $("#draw").disabled = true; $("#slot").classList.remove("hit");
  let n = 0; const total = 24;
  (function tick(){ n++;
    $("#slot").textContent = (n<total ? pool[n%pool.length] : pick).nick; beep(n<total?520:880, n<total?.03:.25);
    if (n < total) setTimeout(tick, 45 + n*n*.9);
    else { $("#slot").classList.add("hit"); res.won.push(pick.id); drawPool(); }
  })();
}

function start(){ if (location.hash === "#host") viewHost(); else { document.body.classList.remove("host"); route(); } }
window.addEventListener("hashchange", start);
start();
</script>
</body>
</html>
