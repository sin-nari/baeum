<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>현장 질의 · 배움:성장</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --ink:#141A24; --navy:#131C31;
  --paper:#F7F6F2; --card:#FFFFFF; --line:#E2DFD6;
  --muted:#6E7480; --dim:#9AA0AA;
  --s1:#7FB13A; --s1-lt:#E6F0DA; --s1-dk:#4C7420;
  --r:14px;
  --q:1.7rem;
  --q-solo:3.4rem;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --serif:"Gowun Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── 상단 ─────────────────────────────── */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 22px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:5}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--muted);font-weight:500}
.state{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s1)}
.dot.off{background:#C0563F}
.cnt{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:16px}
.cnt b{color:var(--ink);font-weight:700}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}

button{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--navy)}
button:focus-visible{outline:2px solid var(--s1-dk);outline-offset:2px}
button.on{background:var(--s1-dk);border-color:var(--s1-dk);color:#fff}
.grp{display:flex}
.grp button{border-radius:0;margin-left:-1px}
.grp button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.grp button:last-child{border-radius:0 8px 8px 0}
.opsonly{display:none}
body.ops .opsonly{display:flex}
body.ops .mk{display:inline-block}

/* ── 본문 ─────────────────────────────── */
main{flex:1;overflow-y:auto;padding:26px 22px 60px}
.list{width:min(1240px,94vw);margin:0 auto;columns:2;column-gap:18px}
@media (max-width:860px){ .list{columns:1} }

.item{break-inside:avoid;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--s1);border-radius:var(--r);
  padding:18px 20px 20px;margin-bottom:18px}
.item.read{border-left-color:var(--line);opacity:.45}
.item.fresh{animation:pop 1.1s ease-out}
@keyframes pop{0%{background:#F2F8E8}100%{background:var(--card)}}

.meta{display:flex;align-items:baseline;gap:9px;font-size:13px;color:var(--dim);margin-bottom:9px}
.who{color:var(--s1-dk);font-weight:700}
.mk{display:none;margin-left:auto;font-size:12px;padding:4px 10px}

.q{font-family:var(--serif);font-size:var(--q);line-height:1.6;
  letter-spacing:-.01em;word-break:keep-all;white-space:pre-wrap}

/* ── 발표 모드 ─────────────────────────── */
.solo{width:min(24em,92vw);margin:0 auto;min-height:58vh;
  display:flex;flex-direction:column;justify-content:center}
.solo .q{font-size:var(--q-solo);line-height:1.5}
.solo .meta{font-size:17px;margin:26px 0 0}
.nav{display:flex;align-items:center;justify-content:center;gap:18px;
  padding:12px 22px;border-top:1px solid var(--line);background:var(--paper)}
.pos{font-size:14px;color:var(--muted);min-width:6em;text-align:center}
.pos b{color:var(--ink);font-size:19px;font-weight:700}

/* ── 안내 화면 ─────────────────────────── */
.blank{width:min(30em,90vw);margin:14vh auto;text-align:center;
  color:var(--muted);line-height:1.85;font-size:16px}
.blank strong{display:block;color:var(--ink);font-size:21px;margin-bottom:10px;font-weight:700}
.blank code{font-size:13.5px;background:var(--card);border:1px solid var(--line);
  padding:2px 7px;border-radius:5px;color:var(--ink)}

@media (prefers-reduced-motion:reduce){ .item.fresh{animation:none} }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">현장 질의 <em>· 배움:성장</em></div>
  <div class="state"><i class="dot" id="dot"></i><span id="stat">여는 중</span></div>
  <div class="cnt"><b id="num">0</b>개</div>

  <div class="tools">
    <div class="grp opsonly">
      <button id="mList" class="on">목록</button>
      <button id="mSolo">발표</button>
    </div>
    <button id="hide" class="opsonly">읽은 질문 숨기기</button>
    <div class="grp">
      <button id="fDown" title="글자 작게">가−</button>
      <button id="fUp" title="글자 크게">가＋</button>
    </div>
    <button id="full">전체 화면</button>
    <button id="ops" title="발표 모드·읽음 표시">진행자</button>
  </div>
</header>

<main id="main"></main>

<nav class="nav opsonly" id="nav" hidden>
  <button id="prev">← 이전</button>
  <div class="pos"><b id="cur">0</b> / <span id="tot">0</span></div>
  <button id="next">다음 →</button>
  <button id="mark">읽음 표시</button>
</nav>

<script>
(function () {
  'use strict';

  /* Apps Script 웹 앱 배포 주소(/exec)를 넣으세요. ?url=... 로도 넘길 수 있습니다. */
  var QNA_URL = 'https://script.google.com/macros/s/AKfycbxZXxvdLSDztdIu1Q5k_Q-SAnVBFcCQkosltdhX1ZxgJggNvD4s70adO5I9yL-u6QGyEA/exec';

  var override = new URLSearchParams(location.search).get('url');
  if (override) QNA_URL = override;

  /* 여러 사람이 동시에 열어도 서버가 버티도록 간격을 넉넉히 두고
     기기마다 조금씩 어긋나게 합니다. 탭이 가려지면 쉽니다. */
  var BASE = 15000, JITTER = 5000;
  var SIZES = [1.3, 1.5, 1.7, 2.0, 2.35];
  var SOLO  = [2.2, 2.8, 3.4, 4.1, 4.8];

  var items = [], seen = {}, read = load();
  var mode = 'list', idx = 0, size = 2, hideRead = false;
  var fails = 0, first = true, timer = null;

  var el = {
    main: document.getElementById('main'), nav: document.getElementById('nav'),
    dot: document.getElementById('dot'), stat: document.getElementById('stat'),
    num: document.getElementById('num'),
    cur: document.getElementById('cur'), tot: document.getElementById('tot')
  };

  function load() {
    try { return JSON.parse(localStorage.getItem('qnaRead') || '{}'); }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem('qnaRead', JSON.stringify(read)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── 데이터 ── */
  window.qnaCallback = function (res) {
    if (!res || !res.ok) { fail(res && res.error); return; }
    fails = 0;
    el.dot.classList.remove('off');
    el.stat.textContent = (res.at || '').slice(0, 5) + ' 기준';

    items = res.items || [];
    items.forEach(function (it) {
      if (!seen[it.id]) { seen[it.id] = true; it.fresh = !first; }
    });
    first = false;
    render();
  };

  function fail(msg) {
    fails++;
    el.dot.classList.add('off');
    el.stat.textContent = fails > 2 ? '연결 끊김' : '다시 시도 중';
    if (msg) console.error(msg);
    if (!items.length) {
      el.main.innerHTML = '<div class="blank"><strong>질문을 불러오지 못했습니다</strong>' +
        'Apps Script를 <code>모든 사용자</code> 액세스로 새로 배포했는지, ' +
        '주소가 <code>/exec</code> 로 끝나는지 확인해 주세요.</div>';
    }
  }

  function poll() {
    if (QNA_URL.indexOf('PASTE_') === 0) {
      el.main.innerHTML = '<div class="blank"><strong>배포 주소를 넣어 주세요</strong>' +
        '이 파일의 <code>QNA_URL</code> 값을 웹 앱 주소로 바꾸거나, ' +
        '주소 끝에 <code>?url=배포주소</code> 를 붙이면 됩니다.</div>';
      return;
    }
    var old = document.getElementById('jsonp');
    if (old) old.remove();
    var s = document.createElement('script');
    s.id = 'jsonp';
    s.src = QNA_URL + '?callback=qnaCallback&t=' + Date.now();
    s.onerror = function () { fail('network'); };
    document.body.appendChild(s);
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return;            // 가려진 탭은 쉽니다
    timer = setTimeout(poll, BASE + Math.random() * JITTER);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) poll(); else clearTimeout(timer);
  });

  /* ── 그리기 ── */
  function visible() {
    var v = items.slice().reverse();                       // 최신 먼저
    return hideRead ? v.filter(function (it) { return !read[it.id]; }) : v;
  }

  function body(it, solo) {
    var who = it.who ? '<span class="who">' + esc(it.who) + '</span>'
                     : '<span>이름 없이</span>';
    var meta = '<div class="meta">' + (it.t ? '<span>' + esc(it.t) + '</span>' : '') + who +
      (solo ? '' : '<button class="mk" data-id="' + it.id + '">' +
        (read[it.id] ? '되돌리기' : '읽음') + '</button>') + '</div>';
    var text = '<p class="q">' + esc(it.q) + '</p>';
    return solo ? text + meta.replace('<div class="meta">', '<div class="meta">')
                : meta + text;
  }

  function render() {
    var v = visible();
    el.num.textContent = items.length;

    if (!v.length) {
      el.nav.hidden = true;
      el.main.innerHTML = '<div class="blank"><strong>' +
        (items.length ? '남은 질문이 없습니다' : '아직 질문이 없습니다') + '</strong>' +
        (items.length ? '‘읽은 질문 숨기기’를 끄면 지난 질문을 다시 볼 수 있습니다.'
                      : '강연 중 떠오른 질문을 QR로 남겨 주세요. 남겨 주시면 이 화면에 바로 올라옵니다.') +
        '</div>';
      return;
    }

    if (mode === 'solo') {
      idx = Math.max(0, Math.min(idx, v.length - 1));
      el.main.innerHTML = '<div class="solo">' + body(v[idx], true) + '</div>';
      el.nav.hidden = false;
      el.cur.textContent = idx + 1;
      el.tot.textContent = v.length;
      document.getElementById('mark').textContent = read[v[idx].id] ? '읽음 취소' : '읽음 표시';
    } else {
      el.nav.hidden = true;
      el.main.innerHTML = '<div class="list">' + v.map(function (it) {
        return '<article class="item' + (read[it.id] ? ' read' : '') +
               (it.fresh ? ' fresh' : '') + '">' + body(it, false) + '</article>';
      }).join('') + '</div>';
    }
    items.forEach(function (it) { it.fresh = false; });
  }

  /* ── 조작 ── */
  el.main.addEventListener('click', function (ev) {
    var b = ev.target.closest('.mk');
    if (!b) return;
    read[b.dataset.id] = !read[b.dataset.id];
    save(); render();
  });

  function setMode(m) {
    mode = m; idx = 0;
    document.getElementById('mList').classList.toggle('on', m === 'list');
    document.getElementById('mSolo').classList.toggle('on', m === 'solo');
    render();
  }
  document.getElementById('mList').onclick = function () { setMode('list'); };
  document.getElementById('mSolo').onclick = function () { setMode('solo'); };

  function resize(d) {
    size = Math.max(0, Math.min(SIZES.length - 1, size + d));
    document.documentElement.style.setProperty('--q', SIZES[size] + 'rem');
    document.documentElement.style.setProperty('--q-solo', SOLO[size] + 'rem');
  }
  document.getElementById('fUp').onclick = function () { resize(1); };
  document.getElementById('fDown').onclick = function () { resize(-1); };

  document.getElementById('hide').onclick = function () {
    hideRead = !hideRead;
    this.classList.toggle('on', hideRead);
    this.textContent = hideRead ? '전체 보기' : '읽은 질문 숨기기';
    idx = 0; render();
  };

  document.getElementById('full').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };

  /* 진행자 도구 — 기본은 감춰 둡니다 */
  document.getElementById('ops').onclick = function () {
    var on = document.body.classList.toggle('ops');
    this.classList.toggle('on', on);
    if (!on) { setMode('list'); hideRead = false;
      var h = document.getElementById('hide');
      h.classList.remove('on'); h.textContent = '읽은 질문 숨기기'; render(); }
  };

  function step(d) { idx += d; render(); }
  document.getElementById('prev').onclick = function () { step(-1); };
  document.getElementById('next').onclick = function () { step(1); };
  document.getElementById('mark').onclick = function () {
    var v = visible(); if (!v[idx]) return;
    read[v[idx].id] = !read[v[idx].id];
    save(); render();
  };

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (mode === 'solo' && e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    if (mode === 'solo' && (e.key === 'ArrowRight' || e.key === ' ')) { step(1); e.preventDefault(); }
    if (e.key === '+' || e.key === '=') resize(1);
    if (e.key === '-') resize(-1);
    if (e.key === 'f' || e.key === 'F') document.getElementById('full').click();
    if (e.key === 'o' || e.key === 'O') document.getElementById('ops').click();
  });

  poll();
})();
</script>
</body>
</html>
